name: Import projects

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  import-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Pages repository
        uses: actions/checkout@v4
        with:
          path: pages

      - name: Check out WebGL repository
        uses: actions/checkout@v4
        with:
          repository: YOUR_USERNAME/webgl-project
          path: source-project
          fetch-depth: 1

      - name: Copy project if it has the marker file
        run: |
          if [ -f source-project/.publish-to-pages ]; then
            rm -rf pages/projects/webgl
            mkdir -p pages/projects/webgl

            rsync -av \
              --exclude='.git' \
              --exclude='.publish-to-pages' \
              source-project/ pages/projects/webgl/
          else
            echo "Marker file not found; nothing copied."
          fi

      - name: Commit and push changes
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add projects/webgl
          git commit -m "Import WebGL project" || exit 0
          git push
